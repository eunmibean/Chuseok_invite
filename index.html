<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>추석맞이 초대장</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <!-- ============ 0. 시작 화면 ============ -->
  <section id="screen-start" class="screen active">
    <div class="moon"></div>
    <h1 class="title">🌕 추석맞이 홈파티</h1>
    <p id="greeting" class="greeting">초대장을 확인하려면<br/>산적 꼬치를 완성해보세요!</p>
    <button id="btn-start" class="btn btn-primary">게임 시작</button>
  </section>

  <!-- ============ 1. 게임 화면 ============ -->
  <section id="screen-game" class="screen">
    <div class="game-hud">
      <div class="hud-left">
        <div class="stage-label">STAGE <span id="stage-num">1</span> / 3</div>
        <div class="target-box" id="target-box"></div>
      </div>
      <div class="hud-right">
        <div class="hearts" id="hearts"></div>
      </div>
    </div>
    <canvas id="game-canvas"></canvas>
    <div id="game-overlay" class="game-overlay hidden">
      <div class="overlay-card">
        <p id="overlay-text"></p>
        <button id="overlay-btn" class="btn btn-primary">계속</button>
      </div>
    </div>
  </section>

  <!-- ============ 2. 선물상자 화면 ============ -->
  <section id="screen-giftbox" class="screen">
    <p class="giftbox-hint">클릭해서 선물상자를 열어보세요 🎁</p>
    <div id="giftbox" class="giftbox">
      <div class="giftbox-lid"></div>
      <div class="giftbox-body"></div>
    </div>
  </section>

  <!-- ============ 3. 초대장 화면 ============ -->
  <section id="screen-invite" class="screen">
    <div class="invite-card">
      <div class="invite-card-inner">
        <h2 class="invite-title">🍂 추석맞이 홈파티 초대장 🍂</h2>
        <p class="invite-to" id="invite-to"></p>
        <p class="invite-body">
          올 한가위, 함께 모여 음식을 나누며<br/>
          즐거운 시간을 보내고 싶어요.<br/>
          여러분을 초대합니다!
        </p>
        <div class="invite-details">
          <div class="detail-row"><span class="detail-icon">📅</span><span id="detail-date"></span></div>
          <div class="detail-row"><span class="detail-icon">📍</span><span id="detail-location"></span></div>
        </div>

        <form id="rsvp-form" class="rsvp-form">
          <label class="field">
            <span>이름</span>
            <input type="text" id="rsvp-name" required placeholder="성함을 입력해주세요" />
          </label>

          <div class="field">
            <span>참석 여부</span>
            <div class="radio-row">
              <label class="radio-pill"><input type="radio" name="attending" value="yes" checked/> 참석할게요 🙋</label>
              <label class="radio-pill"><input type="radio" name="attending" value="no"/> 아쉽지만 못 가요</label>
            </div>
          </div>

          <label class="field" id="guest-count-field">
            <span>참여 인원 (본인 포함)</span>
            <input type="number" id="rsvp-count" min="1" max="20" value="1" required />
          </label>

          <button type="submit" class="btn btn-primary" id="rsvp-submit">참석 의사 보내기</button>
          <p id="rsvp-error" class="error-text hidden"></p>
        </form>

        <div id="rsvp-done" class="rsvp-done hidden">
          <p id="rsvp-done-text"></p>
          <a id="calendar-btn" class="btn btn-calendar" target="_blank" rel="noopener">📅 구글 캘린더에 추가하기</a>
        </div>
      </div>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/calendar.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
